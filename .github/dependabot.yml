version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Bumps go through the release train like everything else: feature → test →
    # main. Without this Dependabot targets the default branch, main, which only
    # ever accepts the test → main release PR — so every bump PR sat BLOCKED on
    # the release gate and had to be retargeted by hand (#299/#300, 2026-09-07),
    # and Dependabot refuses to rebase a PR whose base someone changed for it.
    target-branch: 'test'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # These major bumps are blocked by third-party peer-dependency ranges, not by
    # our code — they fail `npm ci` with ERESOLVE and can't merge until the named
    # upstream package widens its peer range. Ignored so they stop reopening every
    # week. Lift the matching entry once the blocker below ships a release, then
    # let Dependabot reoffer it.
    #
    # Always write these open-ended (`>= N`), never pinned (`N.x`): a pinned
    # entry only blocks the major that was current when it was written, so the
    # next major sails through and lands red. Two edits, two weeks apart, are
    # what let vitest 5 through a block written for vitest 4.
    #
    # Dependabot reads this file from the DEFAULT branch (`main`), so an edit
    # here does nothing until the next release train carries it to `main`.
    ignore:
      # typescript 6 & 7 — typescript-eslint@8 peers `typescript ">=4.8.4 <6.1.0"`,
      # so anything from 6.1 up (incl. the 7.x native port) fails `npm ci` with
      # ERESOLVE (PR #138 was TS 7.0.2). Block every major >= 6 until the toolchain
      # widens its peer range; lift once typescript-eslint supports the target major.
      - dependency-name: 'typescript'
        versions: ['>= 6']
      # eslint 10 / @eslint/js 10 conflict with the eslint peer range used
      # transitively by typescript-eslint. Both must move together. Lift when
      # typescript-eslint supports eslint 10. Open-ended (`>= 10`, not `10.x`)
      # so eslint 11 does not walk straight past the block the way vitest 5 did.
      - dependency-name: 'eslint'
        versions: ['>= 10']
      - dependency-name: '@eslint/js'
        versions: ['>= 10']
      # vite 8 — @wxt-dev/module-react and @tailwindcss/vite peers cap at vite 7.
      # (vite 7 is still allowed through; only 8 is blocked.) Lift when both
      # WXT and the Tailwind vite plugin list `^8`.
      - dependency-name: 'vite'
        versions: ['>= 8']
      # @playwright/test > 1.60 — @serenity-js/playwright-test (latest 3.44.0)
      # peers `@playwright/test ~1.60.0`, so 1.61+ fails npm ci. Block minor/major
      # (1.60.x patches still flow) and drop it from the dev group so the group's
      # other members can still merge. Lift when Serenity widens its peer range.
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      # ORDER MATTERS: a dependency joins the FIRST group it matches, so this
      # sits above dev-dependencies.
      #
      # @vitest/coverage-v8 peers `vitest` at an EXACT version, so the family
      # only ever moves as a unit — a lone bump of either is unresolvable and
      # fails `npm ci` with ERESOLVE before a single test runs. Majors are
      # excluded from the groups below, which is exactly what split them and
      # produced #324, #358 and #359. Grouping the family across every
      # update-type makes a vitest major arrive as ONE installable PR.
      #
      # This replaced a blanket `ignore` on vitest `>= 4`, which suppressed the
      # symptom and, once the repo moved to 5.0.1, would have blocked every 5.x
      # patch — including the next security one. The advisory that forced the
      # 3.2.7 -> 5.0.1 migration (GHSA path traversal in @vitest/mocker) is the
      # reason that mattered.
      #
      # A major still does not auto-merge: dependabot-auto-merge.yml gates on
      # patch/minor, so a human reviews it. The point is that it arrives green.
      #
      # The two satellites are named explicitly as well as matched by the
      # wildcard: GitHub documents `*` for dependency names but does not
      # document it against scoped packages, and a `groups` entry that matches
      # nothing fails silently — Dependabot logs a config error and carries on,
      # which surfaces a week later as split PRs again. `update-types` here
      # takes the short form ('major'), unlike `ignore` above, which takes
      # 'version-update:semver-major'.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@vitest/coverage-v8'
          - '@vitest/mocker'
        update-types: ['major', 'minor', 'patch']
      # Batch low-risk bumps into one PR each to cut noise. Majors are excluded
      # from these two so they arrive individually for careful review (they have
      # broken the test suite before — the vite 8 group).
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'test'
    schedule:
      interval: 'weekly'
