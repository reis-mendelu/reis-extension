name: Publish

on:
  push:
    tags:
      - 'v*'
  # release-tag.yml dispatches this after pushing a tag, since GitHub does not
  # start a run from a `push` event whose tag was pushed with GITHUB_TOKEN
  # (workflow_dispatch and repository_dispatch are the documented exceptions
  # to that rule). A tag pushed by hand from a laptop still works via the
  # `push` trigger above — that's how every v5.0.x shipped.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and submit (e.g. v5.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_dispatch, check out the tag named by the input —
          # the default (github.ref) is whatever ref the run was launched
          # from, which is a separate UI field a human could get out of
          # sync with the input. For the push:tags trigger, inputs.tag is
          # unset and github.ref is already the pushed tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run zip
      - run: npm run zip:firefox

      - name: Submit to stores
        run: npx wxt submit
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
          --edge-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
