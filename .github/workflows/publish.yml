name: Publish

# Part of the release run: release-tag.yml -> ship.yml calls this for every
# release. (It used to be a manual step after the iOS cut; the `push: tags`
# trigger stays removed, because a tag pushed with GITHUB_TOKEN would not fire it
# anyway and the coupling lives in ship.yml.)
#
# To publish the extension on its own: Actions -> Publish -> Run workflow, using
# the tag as both the ref and the `tag` input. Or:
#   gh workflow run publish.yml --ref v5.1.1 -f tag=v5.1.1
on:
  # Also called by ship.yml, so a release run drives the extension too. A tag
  # still never triggers it by itself.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and submit to Chrome and Firefox (e.g. v5.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Only check the store credentials: build the zips, upload nothing, submit nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Runs BEFORE checkout, on purpose. `inputs.tag` is a free-text field, and
      # `ref:` accepts a branch name just as happily as a tag — so without this,
      # dispatching with a branch would run that branch's code (npm ci, wxt
      # submit, and every postinstall on the way) with the store credentials in
      # scope. Nothing from the repository is trusted until the ref is a release
      # tag.
      - name: Refuse a ref that is not a vX.Y.Z tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z). Refusing to build and submit from an arbitrary ref."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # refs/tags/ explicitly, never the bare input: a branch and a tag can
          # share a name, and the bare form resolves the branch first.
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run zip
      - run: npm run zip:firefox

      - name: Submit to stores
        # Chrome goes through Chrome Web Store API v2: a Google Cloud service
        # account (its JSON key's client_email + private_key) that is added
        # under Account in the CWS developer dashboard, plus the publisher id
        # from the dashboard URL. v1.1 (client id/secret + refresh token) stops
        # working on 2026-10-15; the 5.2.0 run was the last one on it.
        #
        # No Edge: there is no reIS listing on Edge Add-ons and Edge users
        # install from the Chrome Web Store. The 5.2.0 run failed on an expired
        # Edge key while both real submissions had already succeeded, which is
        # exactly the false red this line removes.
        #
        # `dry_run` proves the credentials from CI, where they live, without a
        # submission: the store clients authenticate and stop. It is how a new
        # key gets verified — never by re-running a real submit.
        run: npx wxt submit ${{ inputs.dry_run && '--dry-run' || '' }}
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
