name: Publish

# NOT part of the release train any more. The train (test -> main -> a v* tag)
# drives iOS only; the browser extension is published by running this workflow
# by hand against a tag. The `push: tags` trigger was REMOVED on purpose: with
# it, every iOS release tag also submitted the extension to three review queues,
# and a store submission cannot be recalled.
#
# To publish the extension: Actions -> Publish -> Run workflow, using the tag as
# both the ref and the `tag` input. Or:
#   gh workflow run publish.yml --ref v5.1.1 -f tag=v5.1.1
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and submit to Chrome, Firefox and Edge (e.g. v5.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Runs BEFORE checkout, on purpose. `inputs.tag` is a free-text field, and
      # `ref:` accepts a branch name just as happily as a tag — so without this,
      # dispatching with a branch would run that branch's code (npm ci, wxt
      # submit, and every postinstall on the way) with the store credentials in
      # scope. Nothing from the repository is trusted until the ref is a release
      # tag.
      - name: Refuse a ref that is not a vX.Y.Z tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z). Refusing to build and submit from an arbitrary ref."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # refs/tags/ explicitly, never the bare input: a branch and a tag can
          # share a name, and the bare form resolves the branch first.
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run zip
      - run: npm run zip:firefox

      - name: Submit to stores
        run: npx wxt submit
          --chrome-zip .output/*-chrome.zip
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
          --edge-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
