name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # UI/UX gate: lints ONLY the files changed in this PR with --max-warnings=0,
  # so theme/i18n violations (and any other warning) hard-block new or edited code
  # while the pre-existing backlog stays visible-but-non-blocking until swept.
  ui-gate:
    name: UI/UX gate (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed TS/TSX files (zero warnings allowed)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          BASE="$BASE_SHA"
          # Fall back to merge-base; tolerate first-push empty/again-zero base.
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' | grep -vE '\.(test|spec)\.(ts|tsx)$' | grep -vE '^supabase/' || true)"
          else
            CHANGED=""
          fi
          if [ -z "$CHANGED" ]; then
            echo "No non-test TS/TSX changes to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs npx eslint --max-warnings=0

  # Full type check across the whole project (tsc -b). Unlike the lint gate this
  # covers ALL files, so a type error in an unchanged file can no longer merge.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: noUncheckedIndexedAccess ratchet gate
        run: npm run nuia:gate

  # Full unit-test suite.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run

  # The preview build target is exercised by nothing else — no test imports it
  # and no developer runs it by hand — so without this job it would break
  # silently and only surface as a failed Vercel deploy on `test`.
  build-web:
    name: Build web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # public/dev-real-data.json is gitignored (it's the real scraped IS
      # Mendelu student snapshot dev/snapshotPlugin.ts writes locally), so it
      # never exists on CI or Vercel — meaning stripDevRealDataPlugin
      # (vite.web.build.config.ts) never actually strips anything here, and a
      # regression where the plugin stops being reached would pass silently.
      # A decoy file — obviously synthetic, never real IS Mendelu data — makes
      # the strip step do real work in this job, and the assertion below
      # checks it actually ran.
      - name: Write a decoy dev-real-data.json to exercise the strip step
        run: |
          set -euo pipefail
          echo '{"__decoy":"CI decoy, not real IS Mendelu data — see .github/workflows/ci.yml"}' > public/dev-real-data.json
          test -f public/dev-real-data.json
      - run: npm run build:web
      # An empty or near-empty bundle still "succeeds". Assert the entry HTML
      # and at least one hashed asset actually landed.
      - name: Assert the bundle is real
        run: |
          set -euo pipefail
          test -f dist-web/index.html
          test -n "$(find dist-web/assets -name '*.js' -print -quit)"
      # The regression this job exists to catch: the strip plugin silently
      # stops being reached and the (decoy, here) student snapshot ships in a
      # bundle that gets deployed to a public URL.
      - name: Assert dev-real-data.json did not reach the build output
        run: |
          set -euo pipefail
          test ! -f dist-web/dev-real-data.json
