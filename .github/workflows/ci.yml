name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # UI/UX gate: lints ONLY the files changed in this PR with --max-warnings=0,
  # so theme/i18n violations (and any other warning) hard-block new or edited code
  # while the pre-existing backlog stays visible-but-non-blocking until swept.
  ui-gate:
    name: UI/UX gate (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed TS/TSX files (zero warnings allowed)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          BASE="$BASE_SHA"
          # Fall back to merge-base; tolerate first-push empty/again-zero base.
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' | grep -vE '\.(test|spec)\.(ts|tsx)$' | grep -vE '^supabase/' || true)"
          else
            CHANGED=""
          fi
          if [ -z "$CHANGED" ]; then
            echo "No non-test TS/TSX changes to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs npx eslint --max-warnings=0

  # Full type check across the whole project (tsc -b). Unlike the lint gate this
  # covers ALL files, so a type error in an unchanged file can no longer merge.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: noUncheckedIndexedAccess ratchet gate
        run: npm run nuia:gate
      # The Iron Rule that data hooks must not reach the sync layer directly.
      # The script existed but was wired to no npm script and no job, so nobody
      # noticed it had been failing on main; it is a ratchet now, and it runs.
      - name: Architecture ratchet gate
        run: npm run lint:arch

  # Full unit-test suite, with coverage enforced as a ratchet.
  #
  # The iskam parser specs used to be excluded here: they read HTML fixtures from
  # the gitignored .agent/ dir, so they could only ever run on the machine that
  # had scraped them. They now ship synthetic fixtures next to the specs and run
  # everywhere, so nothing is excluded — CI runs the whole suite.
  #
  # That exclusion was costing more than five specs: vitest only emits its
  # coverage report when the run is fully green, so the failures it was hiding
  # locally had also disabled coverage reporting entirely.
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Thresholds live in vitest.config.ts and fail the run when coverage drops
      # below them, so the number can only ratchet upward.
      # json-summary as well as the configured reporters, so the zero-coverage
      # ratchet below has a machine-readable file to read.
      - run: npm run test:coverage -- --coverage.reporter=json-summary --coverage.reporter=text
      # Percentage floors are blind to a NEW untested file: a few hundred
      # uncovered statements move a 44k-statement average by a fraction of a
      # point and merge green. This ratchets the COUNT of never-executed files.
      - run: npm run coverage:zero-gate

  # Runs the suite in randomised order. Four suites here passed only because they
  # were declared in a forgiving order and leaked state into each other: a mock
  # return value that outlived `clearAllMocks`, a Zustand key never reset, and a
  # spy restored over a module mock. Default order hid all of them.
  #
  # The seed is RANDOM per run, and printed so a failure is reproducible locally.
  #
  # Deliberately not pinned. A fixed seed only ever proves the one ordering it
  # encodes, and picking one because it passes is choosing the gate to be green --
  # an earlier revision of this job did exactly that while a third of seeds still
  # failed. A fresh seed each run means order-dependence surfaces on its own.
  test-shuffled:
    name: Unit tests (random order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests, shuffled
        run: |
          SEED=$(( RANDOM * 32768 + RANDOM ))
          echo "::notice::shuffle seed $SEED — reproduce with: npx vitest run --sequence.shuffle --sequence.seed=$SEED"
          npx vitest run --sequence.shuffle --sequence.seed="$SEED"

  # Nothing in CI compiled the artifact that ships. A change could break all
  # three web-store builds or the Capacitor bundle and merge green, to be found
  # at release time by publish.yml -- the first job that ever ran a build.
  build:
    name: Build (chrome, firefox, capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:capacitor

  # ui-gate lints only the files a PR touches, and exits 0 when that list is
  # empty -- so a tests-only PR reported a passing lint gate having linted
  # nothing. This job covers the whole repo and is never vacuous. It is a ratchet,
  # not a wall: the existing backlog is baselined and may only shrink.
  lint-full:
    name: Lint (whole repo, ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:gate

  # Unreferenced files are deleted, not left to rot: 39 of them (1,799 LOC) had
  # accumulated before this gate existed. knip's entry list encodes the roots a
  # bundler-blind tool cannot infer (WXT entrypoints, Deno functions, scripts).
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:dead
      # `lint:dead` runs `knip --include files`, which answers only "is any file
      # unreachable" and hid everything else knip found: 128 unused exports, 121
      # unused exported types, 2 unused dependencies, 5 unused devDependencies.
      # Ratcheted per category so the backlog can only shrink.
      - run: npm run lint:dead:full

  # Dependabot auto-merge claims it "never bypasses CI or CodeQL", but nothing in
  # this repo audited dependencies. A bumped transitive dep with a known advisory
  # could merge itself.
  #
  # --audit-level=high, not critical: the threshold is what actually blocks, and
  # the tree is at 0 advisories today (verified), so there is no backlog to
  # baseline around. Dev dependencies are included -- a compromised build-time
  # package reaches the artifact that ships just as surely as a runtime one.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # NOT RUN HERE, deliberately: e2e.
  #
  # The 20 Playwright/Serenity specs under e2e/ need real MENDELU_USER /
  # MENDELU_PASS credentials — e2e/global-setup.ts signs in to the live
  # is.mendelu.cz and writes storageState.json (gitignored). Adding a job that
  # cannot authenticate would produce a red-or-skipped gate that teaches people
  # to ignore CI, which is worse than the honest gap.
  #
  # Making them runnable means either a dedicated test account in repo secrets,
  # or a mock-data subset that never touches IS. Both are decisions for the
  # maintainers, not something to paper over with a job that always passes.
