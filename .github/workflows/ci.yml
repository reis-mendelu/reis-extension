name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # UI/UX gate: lints ONLY the files changed in this PR with --max-warnings=0,
  # so theme/i18n violations (and any other warning) hard-block new or edited code
  # while the pre-existing backlog stays visible-but-non-blocking until swept.
  ui-gate:
    name: UI/UX gate (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed TS/TSX files (zero warnings allowed)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          BASE="$BASE_SHA"
          # Fall back to merge-base; tolerate first-push empty/again-zero base.
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
          fi
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' | grep -vE '\.(test|spec)\.(ts|tsx)$' | grep -vE '^supabase/' || true)"
          else
            CHANGED=""
          fi
          if [ -z "$CHANGED" ]; then
            echo "No non-test TS/TSX changes to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs npx eslint --max-warnings=0

  # Full type check across the whole project (tsc -b). Unlike the lint gate this
  # covers ALL files, so a type error in an unchanged file can no longer merge.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: noUncheckedIndexedAccess ratchet gate
        run: npm run nuia:gate

  # Full unit-test suite, with coverage enforced as a ratchet.
  #
  # The iskam parser specs used to be excluded here: they read HTML fixtures from
  # the gitignored .agent/ dir, so they could only ever run on the machine that
  # had scraped them. They now ship synthetic fixtures next to the specs and run
  # everywhere, so nothing is excluded — CI runs the whole suite.
  #
  # That exclusion was costing more than five specs: vitest only emits its
  # coverage report when the run is fully green, so the failures it was hiding
  # locally had also disabled coverage reporting entirely.
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Thresholds live in vitest.config.ts and fail the run when coverage drops
      # below them, so the number can only ratchet upward.
      - run: npm run test:coverage

  # Runs the suite in randomised order. Four suites here passed only because they
  # were declared in a forgiving order and leaked state into each other: a mock
  # return value that outlived `clearAllMocks`, a Zustand key never reset, and a
  # spy restored over a module mock. Default order hid all of them.
  #
  # A fixed seed keeps a failure reproducible; bump it deliberately to widen
  # coverage of orderings.
  test-shuffled:
    name: Unit tests (random order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --sequence.shuffle --sequence.seed=20260827

  # Nothing in CI compiled the artifact that ships. A change could break all
  # three web-store builds or the Capacitor bundle and merge green, to be found
  # at release time by publish.yml -- the first job that ever ran a build.
  build:
    name: Build (chrome, firefox, capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:capacitor

  # ui-gate lints only the files a PR touches, and exits 0 when that list is
  # empty -- so a tests-only PR reported a passing lint gate having linted
  # nothing. This job covers the whole repo and is never vacuous. It is a ratchet,
  # not a wall: the existing backlog is baselined and may only shrink.
  lint-full:
    name: Lint (whole repo, ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:gate

  # Unreferenced files are deleted, not left to rot: 39 of them (1,799 LOC) had
  # accumulated before this gate existed. knip's entry list encodes the roots a
  # bundler-blind tool cannot infer (WXT entrypoints, Deno functions, scripts).
  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:dead
