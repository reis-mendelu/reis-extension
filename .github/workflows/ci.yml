name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # UI/UX gate: lints the whole repo with --max-warnings=0, so theme/i18n
  # violations (and any other warning) hard-block. This linted only the files
  # changed in a PR while a pre-existing backlog was tolerated; the backlog is
  # cleared, so the exclusions that came with it — test files, and anything not
  # in the diff — are gone too.
  #
  # The job name is pinned: branch protection on `test` and `main` requires the
  # context "UI/UX gate (changed files)" by that exact string, so renaming it
  # here would leave every PR waiting on a check that never reports. Rename it
  # and the two required-status-check lists in the same change, or not at all.
  ui-gate:
    name: UI/UX gate (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (zero warnings allowed)
        run: npm run lint -- --max-warnings=0

  # Full type check across the whole project (tsc -b). Unlike the lint gate this
  # covers ALL files, so a type error in an unchanged file can no longer merge.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: noUncheckedIndexedAccess ratchet gate
        run: npm run nuia:gate

  # Full unit-test suite.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 is the base: on a PR, the merge commit's first parent.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run

      # The database check lives in this job, not its own, because this job is
      # a required check: a migration that fails here blocks the merge, and a
      # PR without one pays only the diff below. ship.yml applies merged
      # migrations to prod at release, so this is the last look before then.
      - name: Does this change touch the database?
        id: db
        run: |
          if git diff --quiet HEAD^1 HEAD -- supabase/ scripts/db/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migration lint (expand/contract)
        if: steps.db.outputs.changed == 'true'
        run: node scripts/db/lint-migrations.mjs HEAD^1
      - uses: supabase/setup-cli@v3
        if: steps.db.outputs.changed == 'true'
        with:
          version: 2.121.0
      - name: Build a throwaway database from supabase/migrations
        if: steps.db.outputs.changed == 'true'
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - name: Run supabase/tests against it
        if: steps.db.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in supabase/tests/*.sql; do
            echo "== $f"
            docker exec -i supabase_db_reis-extension psql -U postgres -v ON_ERROR_STOP=1 < "$f"
          done

  # The preview build target is exercised by nothing else — no test imports it
  # and no developer runs it by hand — so without this job it would break
  # silently and only surface as a failed Vercel deploy on `test`.
  build-web:
    name: Build web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # public/dev-real-data.json is gitignored (it's the real scraped IS
      # Mendelu student snapshot dev/snapshotPlugin.ts writes locally), so it
      # never exists on CI or Vercel — meaning stripDevRealDataPlugin
      # (vite.web.build.config.ts) never actually strips anything here, and a
      # regression where the plugin stops being reached would pass silently.
      # A decoy file — obviously synthetic, never real IS Mendelu data — makes
      # the strip step do real work in this job, and the assertion below
      # checks it actually ran.
      - name: Write a decoy dev-real-data.json to exercise the strip step
        run: |
          set -euo pipefail
          echo '{"__decoy":"CI decoy, not real IS Mendelu data — see .github/workflows/ci.yml"}' > public/dev-real-data.json
          test -f public/dev-real-data.json
      - run: npm run build:web
      # An empty or near-empty bundle still "succeeds". Assert the entry HTML
      # and at least one hashed asset actually landed.
      - name: Assert the bundle is real
        run: |
          set -euo pipefail
          test -f dist-web/index.html
          test -n "$(find dist-web/assets -name '*.js' -print -quit)"

      # A bundle that builds and contains files can still be broken: it can boot
      # onto skeletons that never resolve, call IS Mendelu on every load, or
      # write to production Supabase. Every one of those shipped at least once on
      # 2026-09-04 and was found by hand. This runs the built app in a real
      # browser and fails on any of them. Demo data only — no credentials.
      - name: Install Chromium for the app health check
        run: npx playwright install --with-deps chromium

      - name: App health check
        run: npm run check:app
      # The regression this job exists to catch: the strip plugin silently
      # stops being reached and the (decoy, here) student snapshot ships in a
      # bundle that gets deployed to a public URL.
      - name: Assert dev-real-data.json did not reach the build output
        run: |
          set -euo pipefail
          test ! -f dist-web/dev-real-data.json
