name: Format

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Prettier check across the whole repo. It was a changed-files gate while a
  # 349-file backlog predating #79 was tolerated; that backlog is swept, so the
  # check now covers everything — including the .html/.js/.mjs the changed-files
  # globs could never reach.
  #
  # Name pinned for the same reason as ci.yml's ui-gate: branch protection
  # requires the context "Format (changed files)" verbatim.
  format-gate:
    name: Format (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
