name: Release tag

# On a merge into main, push `v<version>` — but ONLY when package.json's
# version actually changed in this push AND that tag doesn't exist yet. The
# version itself is bumped in the release PR, so what ships is visible in a diff
# beforehand; the version-changed check is what stops an UNRELATED push to main
# (a doc fix, a back-merge) from tagging whatever version happens to be sitting
# in package.json at HEAD.
#
# THE TAG IS THE RELEASE. This job pushes it, and the `ship` job below, in the
# SAME run, takes it to all three stores (ship.yml): the App Store (build,
# upload, submit for review), Google Play production, and Chrome +
# Firefox. It is a called workflow and not a tag-triggered one because a tag
# pushed with GITHUB_TOKEN does not start other workflows.
#
# Everything the stores need to know is decided before the merge: the version
# bump is in the release PR's diff, and so are the "What's new" words
# (release-notes/<version>.cs.txt). The Release gate fails the PR without that
# file, and this job checks again before tagging, because a pushed tag cannot
# move.

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize: two merges in quick succession must not race two taggings.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    permissions:
      # Pushing a tag is a write to the repository.
      contents: write
    timeout-minutes: 10
    outputs:
      tagged: ${{ steps.push.outputs.tagged }}
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags — and the pre-push version of package.json — are needed to
          # tell an already-released version from a new one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Push v<version> if it does not exist yet AND the version changed
        id: push
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [ -z "$version" ]; then
            echo "::error::package.json has no version field."
            exit 1
          fi
          tag="v$version"

          # The load-bearing check. Without it, ANY later push to main — a
          # README fix, a back-merge — re-pushes an existing tag or re-submits a
          # version the stores have already reviewed and will reject.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — nothing to release. (Bump the version in the release PR to ship a new one.)"
            exit 0
          fi

          # Also check the remote: a tag pushed from a laptop may not be in this
          # checkout's refs if it was created after the clone.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists on the remote — nothing to release."
            exit 0
          fi

          # The other load-bearing check: the tag not existing yet is NOT
          # enough on its own. main's package.json can sit at an already-tagged
          # version for a long time (e.g. bumped by an unrelated release flow)
          # with no v<version> tag ever pushed for it — the very state this
          # branch found main in. The first push to main after this job lands
          # would otherwise tag and submit that version, with zero relation to
          # what the push actually changed. So: only tag when package.json's
          # version differs from what it was immediately before this push.
          #
          # Base commit is the previous tip of main. `before` is normally
          # exactly that — including for an ordinary merge commit, since
          # GitHub always makes the pre-merge main state parent 1, which is
          # also what `HEAD^` resolves to. Two situations need the `HEAD^`
          # fallback instead: the very first push to a branch (`before` is
          # all-zero) and a force-push whose `before` SHA this checkout —
          # even with fetch-depth 0 — does not contain.
          before="$BEFORE_SHA"
          base=""
          if [ -n "$before" ] \
            && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            base="$before"
            echo "Base commit: $base (push 'before' SHA)"
          elif git rev-parse -q --verify "HEAD^" >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
            echo "Base commit: $base ('before' SHA unusable — fell back to HEAD^)"
          else
            echo "::error::Cannot determine the previous commit on main (no usable 'before' SHA and no HEAD^). Refusing to tag without knowing whether the version actually changed — an unrecallable action must not proceed on an unknown."
            exit 1
          fi

          if git rev-parse -q --verify "HEAD^2" >/dev/null 2>&1; then
            echo "HEAD is a merge commit — using its first parent ($base) as the pre-merge state of main, never the second parent or a merge-base."
          fi

          old_package_json="$(git show "$base:package.json" 2>/dev/null || true)"
          if [ -z "$old_package_json" ]; then
            echo "::error::Could not read package.json at $base (main before this push). Refusing to tag without knowing whether the version actually changed."
            exit 1
          fi

          old_version="$(printf '%s' "$old_package_json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
          if [ -z "$old_version" ]; then
            echo "::error::package.json at $base has no readable version field. Refusing to tag without knowing whether the version actually changed."
            exit 1
          fi

          if [ "$old_version" = "$version" ]; then
            echo "package.json version is unchanged ($version) — nothing to release. (This push didn't bump the version.)"
            exit 0
          fi

          echo "Version changed: $old_version -> $version"

          # The tag above is derived from package.json, but `npm run zip`
          # packages the manifest version from wxt.config.ts — the two are
          # bumped by hand in the release PR and can drift. Fail here, before
          # tagging, rather than submit a package whose manifest shows a
          # stale version; a store submission cannot be taken back.
          node scripts/assert-manifest-version-matches.mjs

          # Agreed "What's new" must be in this commit: every store submission
          # reads it from the tagged commit, and a tag cannot move.
          npx --yes tsx@4 scripts/release/assert-notes.ts "$version"

          git tag "$tag"
          git push origin "$tag"
          echo "Pushed $tag."

          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### $tag pushed"
            echo ""
            echo "The \`ship\` job below takes it to the App Store, Google Play (closed"
            echo "testing) and the Chrome and Firefox stores. Its summary table says what"
            echo "reached each one."
          } >> "$GITHUB_STEP_SUMMARY"

  ship:
    name: Ship ${{ needs.tag.outputs.tag }}
    needs: tag
    # Only when this push really cut a tag: an unrelated push to main, or a
    # version that did not change, exits the tag job without one.
    if: needs.tag.outputs.tagged == 'true'
    uses: ./.github/workflows/ship.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      dry_run: false
    secrets: inherit
    permissions:
      contents: read
