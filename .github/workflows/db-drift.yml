name: Database drift

# Nightly: does prod still equal the migrations its ledger says it has?
# supabase/scripts/drift-check.sh builds a throwaway database from exactly those
# files and compares schema (db diff) and grants, policies, buckets and the cron
# job (the fingerprint). Read-only against prod. A red run means someone changed
# prod outside supabase/migrations; GitHub emails the failure.
#
# Migrations merged but not yet released are listed as pending, not as drift.
#
# Never on pull_request: this job holds SUPABASE_ACCESS_TOKEN, and a PR's code
# must not run with it. A schedule and a manual dispatch both run a trusted
# branch's copy (the default branch, or one picked by someone with write
# access). To try a changed drift-check.sh, run `npm run db:drift` locally.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Prod equals its migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Compare prod with its applied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing secret: SUPABASE_ACCESS_TOKEN"; exit 1; }
          bash supabase/scripts/drift-check.sh
