name: Database drift

# Nightly: does prod still equal the migrations its ledger says it has?
# supabase/scripts/drift-check.sh builds a throwaway database from exactly those
# files and compares schema (db diff) and grants, policies, buckets and the cron
# job (the fingerprint). Read-only against prod. A red run means someone changed
# prod outside supabase/migrations; GitHub emails the failure.
#
# Migrations merged but not yet released are listed as pending, not as drift.
# Also runs on a PR that changes the check itself, so it is proven before it
# runs unattended (a schedule only ever runs the default branch's copy).
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/db-drift.yml'
      - 'supabase/scripts/**'

permissions:
  contents: read

concurrency:
  group: db-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Prod equals its migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needs the access token: not for forks or Dependabot.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Compare prod with its applied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing secret: SUPABASE_ACCESS_TOKEN"; exit 1; }
          bash supabase/scripts/drift-check.sh
