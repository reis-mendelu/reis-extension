name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: read

jobs:
  # This workflow deploys straight to the production Supabase project on a push
  # to main, and used to do so with no gate whatsoever.
  #
  # supabase/functions is the least-checked code in the repo and every existing
  # gate is blind to it BY CONFIGURATION: eslint globalIgnores it
  # (eslint.config.js), knip ignores it (knip.json), and tsc never sees it
  # (tsconfig.app.json includes only src + capacitor). vitest's
  # `supabase/**/*.{test,spec}.{js,ts}` glob currently matches ZERO files, so
  # running the node suite here would prove nothing about this directory --
  # a probe violating five rules at once passed all four gates.
  #
  # These are Deno modules, so Deno is what can actually check them. `deno check`
  # type-checks the entry of every function including its remote imports, which
  # is the class of error most likely to take production down on deploy.
  verify:
    name: Verify before deploying
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # --node-modules-dir=auto is required, not optional: functions-js pulls
      # `npm:openai` types transitively, and without it the check aborts on
      # resolution before type-checking anything.
      #
      # Verified locally against deno 2.9.5: passes on a clean tree, and exits 1
      # with TS2322 on a deliberate type error in submit-suggestion.
      #
      # `deno lint` is deliberately NOT run yet: it reports 38 pre-existing
      # problems (mostly no-explicit-any) and would land red. It wants the same
      # baseline-ratchet treatment as scripts/lint-gate.mjs before it can gate.
      - name: Type-check every edge function
        run: |
          shopt -s nullglob
          fns=(supabase/functions/*/index.ts)
          if [ ${#fns[@]} -eq 0 ]; then
            echo "No edge functions found — nothing to check."
            exit 0
          fi
          printf 'Checking %s\n' "${fns[@]}"
          deno check --node-modules-dir=auto "${fns[@]}"

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: zvbpgkmnrqyprtkyxkwn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy gemini-proxy function
        run: supabase functions deploy gemini-proxy --project-ref $PROJECT_ID --no-verify-jwt

      # submit-suggestion was deployed by hand, so the deployed copy and the
      # repo could drift silently. --no-verify-jwt matches how the client calls
      # it: an apikey header plus the shared secret, no Authorization bearer.
      - name: Deploy submit-suggestion function
        run: supabase functions deploy submit-suggestion --project-ref $PROJECT_ID --no-verify-jwt
