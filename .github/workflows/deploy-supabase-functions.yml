name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: zvbpgkmnrqyprtkyxkwn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # society-accounts verifies the caller itself (admin.auth.getUser on the
      # bearer, role looked up by verified uid), and the client calls it with a
      # real session token, so the gateway's own JWT check stays on. v1 was
      # deployed by hand; this keeps the deployed copy equal to the repo.
      - name: Deploy society-accounts function
        run: supabase functions deploy society-accounts --project-ref $PROJECT_ID
