name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: zvbpgkmnrqyprtkyxkwn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy gemini-proxy function
        run: supabase functions deploy gemini-proxy --project-ref $PROJECT_ID --no-verify-jwt

      # --no-verify-jwt matches how the client actually calls this: an `apikey`
      # header and the shared secret, with no Authorization bearer. Deployed with
      # JWT verification on, every feedback submission would be rejected at the
      # gateway before the function's own secret check ever ran.
      - name: Deploy feedback-relay function
        run: supabase functions deploy feedback-relay --project-ref $PROJECT_ID --no-verify-jwt
