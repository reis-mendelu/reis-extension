name: Release checklist

# Injects the checklist into the test -> main release PR when it is opened, so
# it can't be skipped or drift from its single source in
# .github/release-checklist.md. GitHub's native PR templates cannot be selected
# by target branch, hence a workflow.

on:
  pull_request:
    # `edited` fires when a PR's base branch changes. Without it, a PR
    # retargeted from some other branch to `main` (picking up the `test` head
    # ref along the way) never runs this workflow and merges with no
    # checklist. Safe to add: the job below is idempotent (it checks the
    # BEGIN marker and exits early), so a second run on the same PR — e.g. an
    # unrelated title edit — cannot append a duplicate block.
    # `synchronize`: the privacy block below is regenerated when `test` moves
    # while the release PR is open; ticks on unchanged items are kept.
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inject-checklist:
    name: Inject release checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only by `gh pr edit` to rewrite this PR's body.
      pull-requests: write
    # Only this repository's own test -> main PR, so a fork or a branch merely
    # named `test` cannot trigger a write to a PR body.
    if: >-
      github.head_ref == 'test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Inject the checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          begin='<!-- BEGIN release-checklist -->'
          end='<!-- END release-checklist -->'

          # Read the body live rather than from the event payload: the payload is
          # a snapshot taken at open time and `gh pr edit` replaces the whole
          # body, so an author edit made while this job queued would be silently
          # reverted.
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')"

          # Substring match, not line equality: GitHub stores PR bodies with CRLF
          # line endings once anyone edits in the web UI, so an exact comparison
          # would miss a marker that is really there and append a second copy.
          if printf '%s\n' "$body" | grep -qF "$begin"; then
            echo "Checklist already present — nothing to do."
            exit 0
          fi

          block="$(awk -v b="$begin" -v e="$end" '
            index($0, b) { f = 1 }
            f { print }
            index($0, e) { f = 0 }
          ' .github/release-checklist.md)"

          if [ -z "$block" ]; then
            echo "::error::.github/release-checklist.md has no BEGIN/END release-checklist block."
            exit 1
          fi

          # Append below the author's summary, never overwrite it.
          {
            if [ -n "$body" ]; then printf '%s\n\n---\n\n' "$body"; fi
            printf '## Release checklist\n\n%s\n' "$block"
          } > new_body.md

          gh pr edit "$PR_NUMBER" --body-file new_body.md
          echo "Injected the release checklist into PR #$PR_NUMBER."

  # The privacy block: which store declarations changed since the last v* tag,
  # generated from privacy/disclosures.ts (scripts/privacy/). After the checklist
  # job, because both rewrite the PR body and must not race.
  inject-privacy:
    name: Inject privacy disclosures
    needs: inject-checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.head_ref == 'test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Place or refresh the privacy block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          # By version, not `git describe`: the v* tags sit on main's merge
          # commits, which test does not contain.
          export BASE_TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          export PR_BODY="$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')"
          export HEAD_REF=HEAD
          npx --yes tsx@4 scripts/privacy/inject.ts > new_body.md
          if [ "$(cat new_body.md)" = "$PR_BODY" ]; then
            echo "Privacy block already current."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --body-file new_body.md
          echo "Privacy block placed against ${BASE_TAG:-no earlier tag}."
