<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; color: #fff; background: #111827; position: relative; -webkit-font-smoothing: antialiased; }
  body.frame { background: transparent; }
  .layer { position: absolute; inset: 0; display: none; }
  body.intro .intro, body.bg .bg, body.frame .frame, body.outro .outro { display: block; }
  .logo { width: 150px; height: 150px; }
  .logo-sm { width: 84px; height: 84px; }

  .intro .wrap { position: absolute; left: 96px; right: 96px; top: 50%; transform: translateY(-50%); }
  .intro h1 { margin-top: 48px; font-weight: 800; font-size: 112px; line-height: 1.04; letter-spacing: -0.025em; }
  h1 mark, .cap mark { background: none; color: inherit; box-shadow: inset 0 -0.16em 0 #3b5a17; }
  .intro .sub { margin-top: 36px; font-weight: 500; font-size: 44px; line-height: 1.3; color: #9aa3b2; }

  .bg .cap { position: absolute; top: 128px; left: 80px; right: 80px; text-align: center; font-weight: 800; font-size: 64px; line-height: 1.08; letter-spacing: -0.02em; }

  /* screen hole: x 190..890, y 340..1855 (700×1515, the clip's 390:844 aspect) */
  .frame .phone { position: absolute; left: 172px; top: 322px; width: 736px; height: 1551px; border-radius: 86px;
    border: 18px solid #2b3446; box-shadow: 0 0 0 2px #3a4458; }
  .bg .shadow { position: absolute; left: 172px; top: 322px; width: 736px; height: 1551px; border-radius: 86px; box-shadow: 0 50px 140px rgba(0,0,0,.6); background: #0b0f17; }

  .outro .wrap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; display: flex; flex-direction: column; align-items: center; }
  .outro h2 { margin-top: 56px; font-weight: 800; font-size: 120px; letter-spacing: -0.025em; }
  .outro .sub { margin-top: 28px; font-weight: 500; font-size: 46px; color: #c9d0db; }
  .outro .cta { margin-top: 72px; font-weight: 700; font-size: 44px; color: #79be15; border: 3px solid #3b5a17; background: #18240f; padding: 22px 40px; border-radius: 999px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="mark" viewBox="0 0 128 128"><g transform="translate(7,0)">
  <path fill="#fff" fill-rule="evenodd" d="M38 88V86h4V42h-4V40h24c12 0 20 8 20 18s-7 17-17 18l18 12H69L55 76H54v10h4v2H38zM54 66h10c6 0 10-4 10-10s-4-8-10-8H54v18z"/>
  <circle cx="32" cy="96" r="16" fill="#79be15" stroke="#111827" stroke-width="4"/></g></symbol></defs></svg>

  <div class="layer intro"><div class="wrap" data-check>
    <svg class="logo"><use href="#mark"/></svg>
    <h1 id="introH" data-max-lines="4"></h1>
    <p class="sub" id="introS" data-max-lines="3"></p>
  </div></div>

  <div class="layer bg"><div class="shadow"></div><p class="cap" id="cap" data-max-lines="2"></p></div>

  <div class="layer frame"><div class="phone"></div></div>

  <div class="layer outro"><div class="wrap">
    <svg class="logo"><use href="#mark"/></svg>
    <h2 id="outH"></h2>
    <p class="sub" id="outS"></p>
    <p class="cta" id="outC"></p>
  </div></div>
<script>
  const nbsp = (s) => String(s ?? '').replace(/(^|\s)([vkszouaiVKSZOUAI])\s+/g, '$1$2 ');
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const marked = (s) => esc(nbsp(s)).replace(/\*(.+?)\*/g, '<mark>$1</mark>');
  window.fill = (spec, layer) => {
    document.body.className = layer;
    document.getElementById('introH').innerHTML = marked(spec.headline);
    document.getElementById('introS').textContent = nbsp(spec.sub);
    document.getElementById('cap').innerHTML = marked(spec.caption);
    document.getElementById('outH').textContent = spec.outro?.title ?? 'Stáhni si to';
    document.getElementById('outS').textContent = spec.outro?.sub ?? 'Zdarma, od studentů pro studenty';
    document.getElementById('outC').textContent = spec.outro?.cta ?? 'Odkaz v biu';
  };
</script>
</body>
</html>
